<!DOCTYPE html>
<html lang="en" data-session-mode="focus">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />

  <title>Focus Session</title>
  <meta name="description" content="A minimal, resilient focus and Pomodoro timer designed for deep work." />

  <!-- PWA & Mobile Meta Tags -->
  <meta name="theme-color" content="#0B0F17" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Focus" />

  <!-- Web App Manifest & Dynamic Icons -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <link id="favicon-link" rel="icon" type="image/svg+xml" href="./icons/favicon.svg" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />

  <!-- Stylesheet Hierarchy -->
  <link rel="stylesheet" href="./css/tokens.css" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/components.css" />
</head>
<body>
  <!-- Visually Hidden Screen Reader Live Region -->
  <div id="a11y-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <!-- Top Navigation / Session Modes & Settings Trigger -->
  <header class="app-header">
    <nav class="mode-selector" aria-label="Timer Modes">
      <button 
        type="button" 
        class="mode-btn" 
        data-mode="focus" 
        aria-pressed="true"
      >
        Focus
      </button>
      <button 
        type="button" 
        class="mode-btn" 
        data-mode="shortBreak" 
        aria-pressed="false"
      >
        Short Break
      </button>
      <button 
        type="button" 
        class="mode-btn" 
        data-mode="longBreak" 
        aria-pressed="false"
      >
        Long Break
      </button>
    </nav>

    <button 
      type="button" 
      id="open-settings-btn" 
      class="icon-btn" 
      aria-label="Open Settings"
    >
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
  </header>

  <!-- Main Countdown Stage with Radial SVG Ring -->
  <main class="timer-container">
    <svg class="progress-ring" viewBox="0 0 360 360" aria-hidden="true">
      <circle 
        class="progress-ring-bg" 
        cx="180" 
        cy="180" 
        r="160" 
        fill="transparent" 
        stroke-width="8" 
      />
      <circle 
        id="progress-indicator" 
        class="progress-ring-indicator" 
        cx="180" 
        cy="180" 
        r="160" 
        fill="transparent" 
        stroke-width="8" 
        stroke-dasharray="1005.3" 
        stroke-dashoffset="0" 
      />
    </svg>

    <div class="timer-content">
      <time id="timer-display" class="timer-display numeric-tabular">25:00</time>
      <span id="session-mode-label" class="session-label">Deep Focus</span>
    </div>
  </main>

  <!-- Interaction Bar & Cycle Tracker -->
  <footer class="controls-container">
    <div class="action-bar">
      <button 
        type="button" 
        id="reset-btn" 
        class="btn-ghost" 
        aria-label="Reset Session"
      >
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
          <path d="M3 3v5h5"></path>
        </svg>
      </button>

      <button 
        type="button" 
        id="primary-toggle-btn" 
        class="btn-primary" 
        aria-label="Start Focus Session"
      >
        Start
      </button>

      <button 
        type="button" 
        id="skip-btn" 
        class="btn-ghost" 
        aria-label="Skip to Next Session"
      >
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polygon points="5 4 15 12 5 20 5 4"></polygon>
          <line x1="19" y1="5" x2="19" y2="19"></line>
        </svg>
      </button>
    </div>

    <!-- Sequence/Cycle Dot Indicators (4 intervals per full loop) -->
    <div id="cycle-dots" class="cycle-tracker" aria-label="Cycle Progress">
      <span class="cycle-dot" data-active="false"></span>
      <span class="cycle-dot" data-active="false"></span>
      <span class="cycle-dot" data-active="false"></span>
      <span class="cycle-dot" data-active="false"></span>
    </div>
  </footer>

  <!-- Settings Dialog (Native HTML5 Accessible Modal) -->
  <dialog id="settings-dialog" class="modal-dialog">
    <header class="modal-header">
      <h2 class="modal-title">Preferences</h2>
      <button 
        type="button" 
        id="close-settings-btn" 
        class="icon-btn" 
        aria-label="Close Settings"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </header>

    <form id="settings-form" method="dialog">
      <div class="form-row">
        <label for="focus-duration" class="form-label">Focus Duration (mins)</label>
        <input 
          type="number" 
          id="focus-duration" 
          class="form-input" 
          min="1" 
          max="120" 
          value="25" 
          required 
        />
      </div>

      <div class="form-row">
        <label for="short-break-duration" class="form-label">Short Break (mins)</label>
        <input 
          type="number" 
          id="short-break-duration" 
          class="form-input" 
          min="1" 
          max="60" 
          value="5" 
          required 
        />
      </div>

      <div class="form-row">
        <label for="long-break-duration" class="form-label">Long Break (mins)</label>
        <input 
          type="number" 
          id="long-break-duration" 
          class="form-input" 
          min="1" 
          max="60" 
          value="15" 
          required 
        />
      </div>

      <div class="form-row">
        <label for="auto-start-toggle" class="form-label">Auto-start Breaks</label>
        <input 
          type="checkbox" 
          id="auto-start-toggle" 
          class="switch-input" 
        />
      </div>

      <div class="form-row">
        <label for="sound-toggle" class="form-label">Sound Notifications</label>
        <input 
          type="checkbox" 
          id="sound-toggle" 
          class="switch-input" 
          checked 
        />
      </div>

      <footer class="modal-footer">
        <button type="submit" class="btn-primary" style="height: 44px; min-width: 100px;">
          Save
        </button>
      </footer>
    </form>
  </dialog>

  <!-- Application Orchestration Scripts -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
