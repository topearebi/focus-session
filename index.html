<!DOCTYPE html>
<html lang="en" data-theme-mode="sprint">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />

  <title>Rally • Shared Focus & Action Timers</title>
  <meta name="description" content="A flexible, reliable focus companion for deep work, speed sessions, games, and shared body doubling." />

  <!-- Mobile Viewport & PWA Capabilities -->
  <meta name="theme-color" content="#0D0F17" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Rally" />

  <!-- Manifest & Dynamic Favicon Hook -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <link id="favicon-link" rel="icon" type="image/svg+xml" href="./icons/favicon.svg" />
  <link rel="apple-touch-icon" href="./icons/favicon.svg" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="./css/tokens.css" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/components.css" />

  <!-- Serverless Peer-to-Peer Mesh (PeerJS via CDN) -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js" defer></script>
</head>
<body>
  <!-- Accessibility Live Region for Screen Readers -->
  <div id="a11y-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <div id="app">
    <!-- Header & Quick Controls -->
    <header class="app-header">
      <div class="brand-badge">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
        </svg>
        <span>Rally</span>
      </div>

      <!-- Quick Inline Nickname Field -->
      <div class="inline-user-container" title="Edit your display name">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <input 
          type="text" 
          id="inline-name-input" 
          class="inline-name-input" 
          value="Player 1" 
          maxlength="20" 
          aria-label="Your Display Name"
        />
      </div>

      <div class="header-actions">
        <button type="button" id="room-btn" class="room-btn" data-status="disconnected" aria-label="Manage Shared Room">
          <span id="room-status-indicator">👥 Solo</span>
        </button>

        <button type="button" id="open-settings-btn" class="icon-btn" aria-label="Open Settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Radial Timer Stage -->
    <main class="timer-stage" aria-label="Main Timer Display">
      <svg class="progress-ring" viewBox="0 0 340 340" aria-hidden="true">
        <circle 
          class="progress-ring-bg" 
          cx="170" 
          cy="170" 
          r="150" 
          fill="transparent" 
          stroke-width="7" 
        />
        <circle 
          id="progress-indicator" 
          class="progress-ring-indicator" 
          cx="170" 
          cy="170" 
          r="150" 
          fill="transparent" 
          stroke-width="7" 
          stroke-dasharray="942.48" 
          stroke-dashoffset="0" 
        />
      </svg>

      <div class="timer-readout">
        <span id="round-hud-badge" class="round-indicator">Round 1 of 4</span>
        <time id="timer-display" class="timer-digits numeric-tabular">25:00</time>
        <span id="session-mode-badge" class="mode-pill">Sprint</span>
        <div id="cycle-dots-container" class="cycle-dots" aria-hidden="true">
          <!-- Dynamic round dots rendered by ui.js -->
        </div>
      </div>
    </main>

    <!-- Primary Timer Controls -->
    <section class="controls-bar" aria-label="Timer Controls">
      <button type="button" id="reset-btn" class="btn-ghost" aria-label="Reset Timer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
          <path d="M3 3v5h5"></path>
        </svg>
      </button>

      <button type="button" id="primary-toggle-btn" class="btn-primary" aria-label="Start Timer">
        Start
      </button>

      <button type="button" id="skip-btn" class="btn-ghost" aria-label="Skip to Next Phase">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polygon points="5 4 15 12 5 20 5 4"></polygon>
          <line x1="19" y1="5" x2="19" y2="19"></line>
        </svg>
      </button>
    </section>

    <!-- Live Timer Sync Banner (Visible only when inside a room) -->
    <div id="sync-banner" class="sync-banner" style="display: none;">
      <button type="button" id="toggle-sync-btn" class="sync-toggle-btn" aria-pressed="false">
        <span id="sync-status-icon">🔓</span>
        <span id="sync-status-label">Timers Independent (Co-working)</span>
      </button>
    </div>

    <!-- Current Quest & Stepping Stones (Goal Anchor Card) -->
    <section class="quest-card" aria-label="Current Quest and Stepping Stones">
      <div class="quest-header">
        <input 
          type="text" 
          id="quest-title-input" 
          class="quest-title-input" 
          placeholder="What is your Current Quest?" 
          aria-label="Current Quest Title"
          maxlength="80"
        />
        <span id="stones-counter" class="stones-counter">0 / 0</span>
      </div>

      <ul id="stepping-stones-list" class="stepping-stones-list" aria-label="Stepping Stones List">
        <!-- Dynamic stepping stones rendered via ui.js -->
      </ul>

      <form id="add-stone-form" class="add-stone-form">
        <input 
          type="text" 
          id="new-stone-input" 
          class="add-stone-input" 
          placeholder="+ Add a Stepping Stone..." 
          aria-label="New Stepping Stone"
          maxlength="80"
          required
        />
        <button type="submit" class="add-stone-btn">Add</button>
      </form>
    </section>

    <!-- Multi-Peer Presence Grid (Body Doubling Room Roster) -->
    <section id="peer-section" class="peer-section" style="display: none;">
      <h2 class="peer-section-title">Room Squad</h2>
      <div id="peer-grid" class="peer-grid">
        <!-- Remote peer cards rendered via ui.js -->
      </div>
    </section>
  </div>

  <!-- Settings Dialog (<dialog>) -->
  <dialog id="settings-dialog" class="modal-dialog">
    <header class="modal-header">
      <h2 class="modal-title">Preferences</h2>
      <button type="button" id="close-settings-btn" class="icon-btn" aria-label="Close Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </header>

    <form id="settings-form">
      <!-- Sprint Duration: Mins & Secs -->
      <div class="form-row">
        <label class="form-label">Sprint / Focus</label>
        <div style="display: flex; gap: 6px; align-items: center;">
          <input type="number" id="sprint-min" class="form-input" min="0" max="180" value="25" placeholder="min" style="width: 60px;" />
          <span style="font-size: var(--text-xs); color: var(--text-muted);">m</span>
          <input type="number" id="sprint-sec" class="form-input" min="0" max="59" value="0" placeholder="sec" style="width: 54px;" />
          <span style="font-size: var(--text-xs); color: var(--text-muted);">s</span>
        </div>
      </div>

      <!-- Short Rest: Mins & Secs -->
      <div class="form-row">
        <label class="form-label">Short Rest</label>
        <div style="display: flex; gap: 6px; align-items: center;">
          <input type="number" id="short-rest-min" class="form-input" min="0" max="60" value="5" placeholder="min" style="width: 60px;" />
          <span style="font-size: var(--text-xs); color: var(--text-muted);">m</span>
          <input type="number" id="short-rest-sec" class="form-input" min="0" max="59" value="0" placeholder="sec" style="width: 54px;" />
          <span style="font-size: var(--text-xs); color: var(--text-muted);">s</span>
        </div>
      </div>

      <!-- Long Rest: Mins & Secs -->
      <div class="form-row">
        <label class="form-label">Long Rest</label>
        <div style="display: flex; gap: 6px; align-items: center;">
          <input type="number" id="long-rest-min" class="form-input" min="0" max="120" value="15" placeholder="min" style="width: 60px;" />
          <span style="font-size: var(--text-xs); color: var(--text-muted);">m</span>
          <input type="number" id="long-rest-sec" class="form-input" min="0" max="59" value="0" placeholder="sec" style="width: 54px;" />
          <span style="font-size: var(--text-xs); color: var(--text-muted);">s</span>
        </div>
      </div>

      <div class="form-row">
        <label for="rounds-before-long" class="form-label">Rounds Before Long Rest</label>
        <input type="number" id="rounds-before-long" class="form-input" min="1" max="16" value="4" required />
      </div>

      <div class="form-row">
        <label for="total-rounds" class="form-label">Target Rounds (0 = Infinite)</label>
        <input type="number" id="total-rounds" class="form-input" min="0" max="32" value="4" required />
      </div>

      <div class="form-row">
        <label for="auto-start-breaks" class="form-label">Auto-Start Rest Periods</label>
        <input type="checkbox" id="auto-start-breaks" class="switch-input" checked />
      </div>

      <div class="form-row">
        <label for="auto-start-sprints" class="form-label">Auto-Start Sprints</label>
        <input type="checkbox" id="auto-start-sprints" class="switch-input" />
      </div>

      <div class="form-row">
        <label for="timer-direction-select" class="form-label">Timer Style</label>
        <select id="timer-direction-select" class="form-input" style="width: 140px; text-align: left;">
          <option value="countdown">Countdown</option>
          <option value="countup">Flow / Count-up</option>
        </select>
      </div>

      <div class="form-row">
        <label for="sound-toggle" class="form-label">Sound Notifications</label>
        <input type="checkbox" id="sound-toggle" class="switch-input" checked />
      </div>

      <footer class="modal-footer">
        <button type="submit" id="save-settings-btn" class="btn-primary" style="height: 42px; min-width: 110px;">Save Changes</button>
      </footer>
    </form>
  </dialog>

  <!-- Room & Collaboration Dialog (<dialog>) -->
  <dialog id="room-dialog" class="modal-dialog">
    <header class="modal-header">
      <h2 class="modal-title">Shared Squad Room</h2>
      <button type="button" id="close-room-btn" class="icon-btn" aria-label="Close Room Modal">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </header>

    <!-- Connection State & Manual Reconnect -->
    <div class="form-row">
      <span class="form-label">Network Status</span>
      <div style="display: flex; gap: 8px; align-items: center;">
        <span id="room-modal-status" style="font-size: var(--text-xs); font-weight: var(--font-weight-semibold); color: var(--theme-accent);">Checking...</span>
        <button type="button" id="retry-connection-btn" class="btn-ghost" style="display: none; height: 26px; padding: 0 8px; font-size: var(--text-2xs); border-color: var(--surface-border);" title="Retry connection">
          ↻ Retry
        </button>
      </div>
    </div>

    <!-- Active Room Share Section -->
    <div id="room-share-section" style="display: none;">
      <div class="form-row" style="margin-top: var(--space-xs); margin-bottom: 4px;">
        <span class="form-label">Room Code</span>
        <span id="display-room-code" style="font-weight: var(--font-weight-bold); font-size: var(--text-sm); letter-spacing: 0.05em; color: var(--theme-accent);">—</span>
      </div>

      <div class="room-invite-box">
        <input type="text" id="share-link-input" class="form-input form-input-full" readonly placeholder="Generating squad link..." />
        <button type="button" id="copy-link-btn" class="btn-primary" style="height: 38px; min-width: 80px; font-size: var(--text-xs);">Copy</button>
      </div>
    </div>

    <!-- Direct Join via Code Form -->
    <form id="join-room-form" class="join-room-form" style="margin-top: var(--space-md); padding-top: var(--space-md); border-top: 1px solid var(--surface-border);">
      <label for="join-code-input" class="form-label" style="display: block; margin-bottom: 6px;">Join Another Room by Code</label>
      <div style="display: flex; gap: 6px;">
        <input 
          type="text" 
          id="join-code-input" 
          class="form-input form-input-full" 
          placeholder="e.g. yah06vx" 
          maxlength="24"
          required 
        />
        <button type="submit" class="btn-primary" style="height: 38px; min-width: 70px; font-size: var(--text-xs);">Join</button>
      </div>
    </form>

    <footer class="modal-footer">
      <button type="button" id="leave-room-btn" class="btn-ghost" style="display: none; color: var(--color-danger); width: auto; padding: 0 var(--space-sm); font-size: var(--text-xs);">Leave Room</button>
    </footer>
  </dialog>

  <!-- Core App Modules -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
