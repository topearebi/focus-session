<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bgGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0B0F17" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#38BDF8" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Circular Base Plate -->
  <rect width="64" height="64" rx="16" fill="url(#bgGradient)" />

  <!-- Outer Guide Track -->
  <circle
    cx="32"
    cy="32"
    r="21"
    fill="none"
    stroke="#334155"
    stroke-width="4.5"
    opacity="0.6"
  />

  <!-- Active Timing Arc (Quarter turn representing focus progression) -->
  <path
    d="M 32 11 A 21 21 0 1 1 11 32"
    fill="none"
    stroke="#38BDF8"
    stroke-width="4.5"
    stroke-linecap="round"
    filter="url(#glow)"
  />

  <!-- Central Focus Node -->
  <circle cx="32" cy="32" r="5" fill="#F8FAFC" />
</svg>
